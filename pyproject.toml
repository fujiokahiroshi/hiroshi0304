[project]
name = "claude-cad-workbench"
version = "0.1.0"
description = "Claude MCP + CadQuery + OCP CAD Viewer workbench"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "cadquery>=2.6,<3",
  "mcp>=2,<3",
  "ocp-vscode>=3.0,<5",
]

[project.scripts]
cad-mcp = "cad_workbench.server:main"
cad-dashboard = "cad_workbench.dashboard:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_workbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["jobs", "runtime"]
